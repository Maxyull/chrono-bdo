name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Le plancher déclaré dans pyproject est 3.10 : on le vérifie
        # réellement plutôt que de l'annoncer.
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Installer le projet
        # `capture` est inclus : sans numpy, la vérification de types ne peut
        # pas analyser le module de capture et le signale comme introuvable.
        # Les tests, eux, n'ont jamais besoin d'un écran.
        run: python -m pip install -e ".[capture,dev]"

      - name: Style
        run: ruff check .

      - name: Types
        run: mypy

      - name: Tests
        # Les tests marqués `reseau` sont exclus : la chaîne d'intégration ne
        # doit pas dépendre de la disponibilité d'un site tiers, ni le solliciter
        # à chaque poussée.
        run: pytest -m "not reseau"
