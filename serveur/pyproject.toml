[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rubin-serveur"
version = "0.3.0"
description = "Serveur de classement pour Rubin, le chronomètre de quêtes BDO"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Maxime Lacoste" }]

dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  # Le client partage la définition du lot avec le serveur : une seule source
  # pour les deux évite que leurs deux idées du même message ne divergent.
  "rubin-bdo",
]

[project.optional-dependencies]
# Postgres en production, SQLite en développement et pour les tests. La même
# couche d'accès sert les deux, ce qui évite d'écrire des requêtes qu'on ne
# vérifierait jamais avant la mise en ligne.
postgres = ["psycopg[binary]>=3.1"]
dev = [
  "pytest>=8.0",
  "httpx2>=0.28",
  "ruff>=0.6",
  "mypy>=1.11",
  "pip-audit>=2.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers --strict-config"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "A", "C4", "SIM", "PTH", "RUF", "S"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
files = ["src"]
strict = true
warn_unreachable = true
