[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rubin-bdo"
version = "0.5.9"
description = "Rubinmètre de quêtes pour Black Desert Online, pensé pour le client français"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Maxime Lacoste" }]
keywords = ["black-desert-online", "bdo", "quests", "speedrun", "ocr", "francais"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: French",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Games/Entertainment",
]

dependencies = [
  "requests>=2.31.0",
  "platformdirs>=4.0",
]

[project.optional-dependencies]
# La capture et la reconnaissance arrivent avec le module de chronométrage.
# Le référentiel des quêtes n'en a pas besoin : il se construit hors ligne, et
# ses tests tournent sans écran ni moteur d'OCR.
capture = [
  "mss>=9.0.1",
  "Pillow>=10.0.0",
  "numpy>=1.26",
  "rapidocr-onnxruntime>=1.3.24",
  "rapidfuzz>=3.6",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-requests",
  "pip-audit>=2.7",
]

[project.urls]
Source = "https://github.com/Maxyull/rubin-bdo"
Bogues = "https://github.com/Maxyull/rubin-bdo/issues"

[project.scripts]
rubin = "rubin.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rubin = ["py.typed", "capture/data/*.png", "interface/data/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers --strict-config"
markers = [
  "reseau: test nécessitant un accès réseau réel (désactivé par défaut en CI)",
]
filterwarnings = ["error"]

# Le paquet s'appelle `rubin` depuis le renommage. Tant que ce chemin
# pointait `src/chrono`, la couverture mesurait un dossier inexistant et
# rendait un rapport vide sans se plaindre.
[tool.coverage.run]
source = ["src/rubin"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: pas de couverture", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "A", "C4", "SIM", "PTH", "RUF", "S"]
ignore = [
  # Les données du domaine sont en français et contiennent des caractères que
  # ces règles signalent comme « ambigus » face à leur équivalent ASCII. Faux
  # positif systématique sur un projet francophone par conception.
  "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]

[tool.mypy]
# Pas de python_version figée : mypy vise la version de l'interpréteur qui
# l'exécute, donc chaque job de la matrice vérifie le code avec la sémantique
# de SA version. Même raisonnement que dans butin-bdo.
files = ["src"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["mss.*", "rapidocr_onnxruntime.*", "cv2.*"]
ignore_missing_imports = true
